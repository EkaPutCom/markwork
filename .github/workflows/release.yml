# Builds the installers on each system and attaches them to a GitHub release when a version tag is pushed (v1.2.3). The
# updater of the installed app reads the same release. Signing and notarizing use the secrets below and are skipped when
# they are not set:
#   macOS:    CSC_LINK, CSC_KEY_PASSWORD (a Developer ID Application certificate, base64), APPLE_ID,
#             APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows:  WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD (a code-signing certificate)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dist:
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run electron:build
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
