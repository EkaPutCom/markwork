  <rect x="32" y="70" width="34" height="5" rx="2.5" fill="#9a9996"/>
  <!-- task checkbox -->
  <rect x="32" y="84" width="10" height="10" rx="2" fill="none" stroke="#2ec27e" stroke-width="3"/>
  <rect x="48" y="86.5" width="24" height="5" rx="2.5" fill="#9a9996"/>
  <!-- pena -->
  <g transform="rotate(45 96 70)">
    <rect x="88" y="26" width="16" height="64" rx="3" fill="url(#pen)"/>
    <rect x="88" y="26" width="16" height="10" rx="3" fill="#1a5fb4"/>
