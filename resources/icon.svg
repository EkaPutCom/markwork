  <!-- lines of Markdown text: heading and paragraph -->
  <rect x="32" y="28" width="40" height="8" rx="4" fill="#3d3846"/>
  <rect x="32" y="46" width="56" height="5" rx="2.5" fill="#9a9996"/>
